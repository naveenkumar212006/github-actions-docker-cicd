services:
  web:
    image: ${DOCKER_IMAGE:-cicd-local-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-web-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      org.opencontainers.image.title: "CI/CD Docker Web App"
      org.opencontainers.image.description: "Automated Docker CI/CD deployment with GitHub Actions"
