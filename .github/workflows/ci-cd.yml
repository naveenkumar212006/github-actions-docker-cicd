name: CI/CD Pipeline (Build, Test & Push)

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # STAGE 1: Automated Lint & Unit Tests
  # ==========================================
  test:
    name: Run Lint & Automated Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Syntax & Linter Check
        run: npm run lint

      - name: Run Unit & API Tests
        run: npm test

  # ==========================================
  # STAGE 2: Docker Build & Push to Docker Hub
  # ==========================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # STAGE 3: Generate Deployment Summary
      # ==========================================
      - name: Write CI/CD Step Summary
        run: |
          echo "## 🚀 CI/CD Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Docker Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Hub Repository:** [https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app](https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app)" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ steps.docker_build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 Run Locally on Docker (No Cloud Needed)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 3000:3000 --name cicd-app ${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "# Visit http://localhost:3000" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ☸️ Deploy Locally to Minikube" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "minikube start" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image deployment/cicd-web-deployment web-container=${{ secrets.DOCKERHUB_USERNAME }}/cicd-web-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "kubectl rollout status deployment/cicd-web-deployment" >> $GITHUB_STEP_SUMMARY
          echo "minikube service cicd-web-service" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

